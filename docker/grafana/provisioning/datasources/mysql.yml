# Grafana가 시작할 때 MySQL 데이터 소스를 자동 등록한다
apiVersion: 1
datasources:
  - name: IDC-MySQL
    type: mysql
    uid: idc-mysql
    url: mysql:3306          # 같은 docker 네트워크 안의 서비스 이름
    user: ${DB_USER}
    isDefault: true
    jsonData:
      database: ${DB_NAME}
    secureJsonData:
      password: ${DB_PASSWORD}
